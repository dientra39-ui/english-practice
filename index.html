.w{cursor:pointer;border-bottom:1px dotted var(--mu)}.w:hover{color:var(--ac)}.lw{font-size:1.5rem}.lp{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.mod{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-start;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) 12px calc(16px + env(safe-area-inset-bottom,0px));overflow:auto;z-index:20}.mod[hidden]{display:none}.mb{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;width:100%;max-width:640px}.mb .row input{flex:1;width:auto}

</style></head><body>
<div class="wrap"><header><div class="bar"><span id="who" class="mu"></span><span><button class="ic" data-a="look">🔎 Tra từ</button> <button class="ic" data-a="hist">📚 Lịch sử</button> <button class="ic" data-a="theme" id="th">🌓</button></span></div><h1>🎓 Luyện đặt câu <span>Việt → Anh</span></h1><p class="mu">Dịch câu tiếng Việt bằng đúng từ vựng của bạn, nhận sửa lỗi, giải thích và nghe phát âm ngay.</p></header><main id="app"></main></div><div id="toast"></div><div id="lk" class="mod" hidden><div class="mb"><div class="top"><h2>🔎 Tra từ vựng</h2><button class="ic" data-a="lkx">✕ Đóng</button></div><div class="row"><input id="lq" placeholder="Nhập từ tiếng Anh hoặc tiếng Việt…" autocomplete="off" autocapitalize="off"><button class="btn" data-a="lkgo">Tra</button></div><div id="lr"></div></div></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const LV=[["A1","Rất dễ","Câu đơn, thì hiện tại đơn/quá khứ đơn cơ bản"],["A2","Dễ","Câu ghép đơn giản, từ vựng thông dụng hằng ngày"],["B1","Trung bình","Mệnh đề quan hệ, câu điều kiện loại 1–2, từ vựng giao tiếp công việc"],["B2/C1","Khá","Câu phức, thành ngữ (idioms), phrasal verbs, từ vựng học thuật"],["C1/C2","Khó","Văn phong bản xứ tự nhiên, đảo ngữ, từ vựng nâng cao, sắc thái tinh tế"]];
const S={words:[],level:4,items:[],i:0,res:[],src:"",voice:"US",rate:1,busy:0};
/* Cấu hình Firebase (điền khi tự đưa web lên host riêng để bật đăng nhập Google/email) */
const FB={apiKey:"AIzaSyDPFQ7PqJnVIq45Smki_3j67uuwrwOFkQY",authDomain:"pracbysen.firebaseapp.com",projectId:"pracbysen",appId:"1:381844473236:web:6cbb59e3ce13cdeeba3b81"};
let SM,FA;
async function smp(){if(SM===undefined){try{SM=(await window.claude?.use("sample"))||null}catch(e){SM=null}}return SM}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("show"),1800)}
const vb=()=>`<div class="seg">${["US","UK"].map(v=>`<button class="${S.voice==v?"on":""}" data-a="vo" data-v="${v}">${v=="US"?"US · Anh-Mỹ":"UK · Anh-Anh"}</button>`).join("")}</div><div class="seg">${[.75,1,1.25].map(r=>`<button class="${S.rate==r?"on":""}" data-a="rt" data-v="${r}">${r}x</button>`).join("")}</div>`;
const refreshVB=()=>document.querySelectorAll(".vb").forEach(e=>e.innerHTML=vb());
/* ---------- TTS ---------- */
const TTS="speechSynthesis" in window;let V=[];
if(TTS){const l=()=>{V=speechSynthesis.getVoices()};l();speechSynthesis.addEventListener("voiceschanged",l)}
const PREF={US:["Google US English","Microsoft Aria","Microsoft Jenny","Samantha","Natural"],UK:["Google UK English Female","Microsoft Sonia","Microsoft Libby","Daniel","Natural"]};
function pick(){const lang=S.voice=="US"?"en-US":"en-GB",l=V.filter(v=>v.lang.replace("_","-")==lang);for(const p of PREF[S.voice]){const f=l.find(v=>v.name.includes(p));if(f)return f}return l[0]||V.find(v=>v.lang.startsWith("en"))}
function speak(t,b){if(!TTS)return toast("Trình duyệt chưa hỗ trợ đọc văn bản");speechSynthesis.cancel();document.querySelectorAll(".spb.on").forEach(x=>x.classList.remove("on"));const u=new SpeechSynthesisUtterance(t),v=pick();if(v)u.voice=v;u.lang=S.voice=="US"?"en-US":"en-GB";u.rate=S.rate;b.classList.add("on");u.onend=u.onerror=()=>b.classList.remove("on");speechSynthesis.speak(u)}
async function copy(t){try{await navigator.clipboard.writeText(t)}catch(e){const x=document.createElement("textarea");x.value=t;document.body.append(x);x.select();try{document.execCommand("copy")}catch(_){}x.remove()}toast("Đã copy")}
/* ---------- Diff ---------- */
const key=w=>w.toLowerCase().replace(/[’‘]/g,"'").replace(/[^a-z0-9']/g,"");
function diff(a,b){const x=a.split(/\s+/).filter(Boolean),y=b.split(/\s+/).filter(Boolean),n=x.length,m=y.length,L=Array.from({length:n+1},()=>Array(m+1).fill(0));
for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)L[i][j]=key(x[i])==key(y[j])?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
let i=0,j=0,p=[],q=[];while(i<n&&j<m){if(key(x[i])==key(y[j])){p.push(esc(x[i++]));q.push(esc(y[j++]))}else if(L[i+1][j]>=L[i][j+1])p.push(`<del>${esc(x[i++])}</del>`);else q.push(`<ins>${esc(y[j++])}</ins>`)}
while(i<n)p.push(`<del>${esc(x[i++])}</del>`);while(j<m)q.push(`<ins>${esc(y[j++])}</ins>`);return[p.join(" "),q.join(" "),L[0][0]]}
/* ---------- Prompts (ép JSON chuẩn) ---------- */
const RULE="CHỈ trả về MỘT đối tượng JSON hợp lệ. Không markdown, không ```, không lời dẫn, không chú thích. Mọi chuỗi dùng dấu nháy kép, không xuống dòng trong chuỗi.";
const genPrompt=(w,l,n)=>`Bạn là giáo viên tiếng Anh giàu kinh nghiệm. ${RULE}
Từ vựng bắt buộc: ${JSON.stringify(w)}
Trình độ CEFR: ${LV[l-1][0]} (${LV[l-1][2]}). Số câu cần tạo: đúng ${n}${n==w.length?" (bằng số từ)":""}.
Yêu cầu: mỗi câu tiếng Việt tự nhiên, rõ nghĩa, dịch sang tiếng Anh được bằng đúng MỘT từ vựng bắt buộc (trường "w", viết đúng như danh sách). Mỗi câu dùng đúng một từ vựng bắt buộc. Nếu số câu bằng số từ thì mỗi từ dùng đúng một lần; nếu nhiều câu hơn số từ thì mỗi từ dùng ít nhất một lần và các từ còn lại được lặp ở ngữ cảnh khác nhau; nếu ít câu hơn số từ thì chọn ${n} từ khác nhau trong danh sách. Câu tiếng Việt phải khiến người học bắt buộc hoặc rất tự nhiên phải dùng từ đó, ở đúng cấp độ CEFR. Trường "h" là gợi ý ngắn bằng tiếng Việt: loại từ, nghĩa, một collocation phổ biến (không viết sẵn bản dịch). Trường "en" là một câu dịch chuẩn, tự nhiên, đúng trình độ.
Định dạng: {"items":[{"vi":"câu tiếng Việt","w":"từ bắt buộc","en":"câu tiếng Anh mẫu","h":"gợi ý từ vựng"}]}`;
const gradePrompt=(it,a,l)=>`Bạn là giáo viên tiếng Anh thân thiện chấm bài dịch Việt→Anh. ${RULE}
Câu tiếng Việt: ${JSON.stringify(it.vi)}
Từ vựng bắt buộc: ${JSON.stringify(it.w)}
Câu của học viên: ${JSON.stringify(a)}
Câu mẫu tham khảo: ${JSON.stringify(it.en)}
Trình độ: ${LV[l-1][0]}. Chấm ngữ pháp, chính tả, từ loại, giới từ và cách dùng từ bắt buộc. Nếu câu đã đúng và tự nhiên thì "corrected" giữ nguyên câu đó và score >= 90. "corrected" phải giữ ý của học viên (sửa tối thiểu) và PHẢI chứa từ bắt buộc.
Định dạng: {"score":số nguyên 0-100,"corrected":"câu đã sửa hoàn chỉnh","note":"giải thích tiếng Việt thân thiện 2-4 câu: sai ở đâu, vì sao, từ bắt buộc đi với giới từ/sắc thái gì","a1":"cách nói tự nhiên, giao tiếp hằng ngày","a2":"cách nói trang trọng/nâng cao có collocations hoặc cấu trúc ăn điểm"}`;
async function ask(p){for(let k=0;k<2;k++){try{const t=(await (SM||api)(p,{cache:false})).text;return JSON.parse(t.slice(t.indexOf("{"),t.lastIndexOf("}")+1))}catch(e){if(e&&e.code)throw e}}throw 0}
/* ---------- Setup ---------- */
function setup(){$("#app").innerHTML=`<section class="card"><h2>1. Từ vựng mục tiêu <small class="mu">(tối đa 20 từ)</small></h2><div class="chips" id="chips"></div><input id="wi" placeholder="Gõ từ rồi nhấn Enter hoặc dấu phẩy…" autocomplete="off" autocapitalize="off"><h2>2. Cấp độ (CEFR)</h2><div class="lv" id="lv"></div><p class="mu" id="ld"></p><h2>3. Số câu <small class="mu">(tùy chọn)</small></h2><input id="nq" type="number" min="1" max="20" inputmode="numeric" placeholder="Để trống = bằng số từ vựng đã nhập"><h2>4. Giọng đọc</h2><div class="vb"></div><div id="kb" hidden></div><div class="row"><button class="btn" id="go" data-a="go">Tạo bài tập bằng AI</button></div><p class="err" id="er"></p><p class="mu">Nếu không chọn số câu, số câu sẽ bằng số từ vựng bạn nhập (chọn tối đa 20 câu). Mỗi phiên luyện tập được lưu vào Lịch sử.</p></section>`;
chips();lvl();refreshVB();smp().then(s=>{if(!s){$("#kb").hidden=false;kbUI()}});const w=$("#wi");
w.addEventListener("keydown",e=>{if(e.key=="Enter"||e.key==","){e.preventDefault();add(w.value);w.value=""}else if(e.key=="Backspace"&&!w.value){S.words.pop();chips()}});
w.addEventListener("input",()=>{if(/[,;]/.test(w.value)){add(w.value);w.value=""}});w.addEventListener("blur",()=>{add(w.value);w.value=""});
w.addEventListener("paste",e=>{e.preventDefault();add(e.clipboardData.getData("text"))})}
function add(t){t.split(/[,\n;]+/).map(x=>x.trim().toLowerCase()).filter(Boolean).forEach(w=>{if(S.words.length<20&&!S.words.includes(w))S.words.push(w)});chips()}
function chips(){$("#chips").innerHTML=S.words.map((w,i)=>`<span class="chip">${esc(w)}<button data-a="rm" data-i="${i}" aria-label="Xóa">×</button></span>`).join("")||'<span class="mu">Chưa có từ nào</span>'}
function lvl(){$("#lv").innerHTML=LV.map((l,i)=>`<button class="${S.level==i+1?"on":""}" data-a="lv" data-i="${i+1}"><b>${i+1}</b><span>${l[0]}</span></button>`).join("");$("#ld").textContent=`Cấp ${S.level} · ${LV[S.level-1][1]}: ${LV[S.level-1][2]}`}
async function go(){const er=$("#er"),b=$("#go");add($("#wi").value);$("#wi").value="";if(!S.words.length){er.textContent="Hãy nhập ít nhất 1 từ vựng.";return}
if(!await smp()&&!KEY()){er.textContent="Hãy nhập API Key của bạn ở ô phía trên để dùng chế độ AI.";return}
er.textContent="";b.disabled=true;b.innerHTML='<i class="spin"></i> Đang tạo bài…';
try{const q=parseInt($("#nq").value),n=q>0?Math.min(20,q):S.words.length,d=await ask(genPrompt(S.words,S.level,n)),its=(d.items||[]).filter(x=>x&&x.vi&&x.w&&x.en).slice(0,n);if(!its.length)throw 0;S.items=its;start("ai")}
catch(e){er.textContent=e&&e.code=="not_granted"?"Bạn chưa cho phép dùng Claude. Hãy thử lại.":e&&e.code=="api"?"Lỗi API: "+(e.message||"hãy kiểm tra lại API Key."):"Không tạo được bài tập. Vui lòng thử lại.";b.disabled=false;b.textContent="Tạo bài tập bằng AI"}}
function start(src){S.src=src;S.i=0;S.res=[];S.busy=0;S.ses={id:"s"+Date.now(),t:Date.now(),src,level:S.level,words:S.items.map(x=>x.w),items:S.res};practice()}
/* ---------- Practice ---------- */
function practice(){const it=S.items[S.i],n=S.items.length;$("#app").innerHTML=`<div class="prog"><div style="width:${S.res.length/n*100}%"></div></div><p class="mu c" id="pt">Đã hoàn thành ${S.res.length}/${n} câu</p><section class="card"><span class="tag">Câu ${S.i+1}/${n}</span><p class="vi">${esc(it.vi)}</p><p>Từ bắt buộc: <b class="req">${esc(it.w)}</b> <button class="ic" data-a="hint">💡 Gợi ý từ vựng</button> <button class="ic" data-a="look" data-t="${esc(it.w)}">🔎 Tra từ này</button></p><div id="hint"></div><textarea id="ans" rows="3" placeholder="Gõ câu dịch tiếng Anh của bạn…" autocapitalize="sentences" spellcheck="false"></textarea><div class="row"><button class="btn" id="ck" data-a="check">Kiểm tra &amp; Chấm điểm</button><button class="btn ghost" data-a="reset">↺ Làm bài tập mới</button></div></section><div id="fb"></div>`;$("#ans").focus()}
async function check(){const ta=$("#ans"),a=ta.value.trim();if(!a)return toast("Hãy nhập câu dịch trước nhé");if(S.busy)return;S.busy=1;const it=S.items[S.i],ck=$("#ck");ck.disabled=true;ck.innerHTML='<i class="spin"></i> Đang chấm…';ta.disabled=true;$("#fb").innerHTML='<div class="card sk"><i></i><i></i><i></i></div>';
try{let r;{const d=await ask(gradePrompt(it,a,S.level));if(!d.corrected)throw 0;r={score:Math.max(0,Math.min(100,Math.round(+d.score||0))),corrected:String(d.corrected),note:String(d.note||""),a1:String(d.a1||d.corrected),a2:String(d.a2||d.corrected)}}
S.res.push({vi:it.vi,w:it.w,a,s:r.score,c:r.corrected,note:r.note,a1:r.a1,a2:r.a2});const ses=S.ses;S.sv=(S.sv||Promise.resolve()).then(()=>save(ses));const n=S.items.length;$(".prog div").style.width=S.res.length/n*100+"%";$("#pt").textContent=`Đã hoàn thành ${S.res.length}/${n} câu`;ck.remove();$("#fb").innerHTML=fbHTML(r,a);refreshVB();$("#fb").scrollIntoView({behavior:"smooth",block:"nearest"})}
catch(e){$("#fb").innerHTML="";ta.disabled=false;ck.disabled=false;ck.innerHTML="Kiểm tra &amp; Chấm điểm";toast(e&&e.code=="api"?String(e.message||"Lỗi API").slice(0,140):"Chấm bài chưa được, hãy thử lại")}S.busy=0}
const alt=(l,t)=>`<div class="alt"><p class="lbl">${l}</p><p class="ln">${wf(t)}</p><button class="ic" data-a="copy" data-t="${esc(t)}">Copy</button></div>`;
const au=(l,t)=>`<button class="spb" data-a="say" data-t="${esc(t)}"><span class="ico">🔊</span><span class="bars"><i></i><i></i><i></i><i></i></span>${l}</button>`;
function fbHTML(r,a){const[d1,d2]=diff(a,r.corrected),c=r.score>=85?"ok":r.score>=60?"mid":"bad";
return `<section class="card"><div class="top"><h2>Kết quả</h2><span class="score ${c}">${r.score}/100</span></div>
<h3>1. Đánh giá &amp; sửa lỗi</h3><p class="lbl">Câu của bạn <span style="text-transform:none">(đỏ = cần sửa)</span></p><p class="ln">${d1}</p><p class="lbl">Câu đã sửa <span style="text-transform:none">(xanh = bổ sung/thay thế)</span></p><p class="ln fix">${d2}</p><button class="ic" data-a="copy" data-t="${esc(r.corrected)}">Copy câu mẫu</button>
<h3>2. Giải thích</h3><p>${esc(r.note)}</p>
<h3>3. Nâng cấp câu <small class="mu">(bấm vào từ để tra)</small></h3>${alt("Cách 1 · Tự nhiên / giao tiếp",r.a1)}${alt("Cách 2 · Trang trọng / nâng cao",r.a2)}
<h3>4. Nghe phát âm</h3><div class="vb"></div><div class="au">${au("Câu đã sửa",r.corrected)}${au("Cách 1",r.a1)}${au("Cách 2",r.a2)}</div>
<div class="row"><button class="btn" data-a="next">${S.i+1<S.items.length?"Câu tiếp theo →":"Xem kết quả"}</button></div></section>`}
function next(){speechSynthesis?.cancel();S.i++;S.i>=S.items.length?done():practice();scrollTo({top:0})}
function done(){const avg=Math.round(S.res.reduce((t,r)=>t+r.s,0)/S.res.length);$("#app").innerHTML=`<section class="card c"><h2>🎉 Hoàn thành!</h2><p class="big">${avg}<small>/100</small></p><p class="mu">Điểm trung bình của ${S.res.length} câu</p>${S.res.map(r=>`<div class="rs"><b>${r.s}</b><div><p class="mu">${esc(r.vi)}</p><p>${esc(r.c)}</p></div></div>`).join("")}<div class="row" style="justify-content:center"><button class="btn" data-a="reset">Làm bài tập mới</button><button class="btn ghost" data-a="hist">📚 Xem lịch sử</button></div></section>`}
function reset(){TTS&&speechSynthesis.cancel();S.busy=0;setup();scrollTo({top:0})}
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b)return;const i=+b.dataset.i;({rm(){S.words.splice(i,1);chips()},lv(){S.level=i;lvl()},go,check,next,reset,vo(){S.voice=b.dataset.v;refreshVB()},rt(){S.rate=+b.dataset.v;refreshVB()},say(){speak(b.dataset.t,b)},copy(){copy(b.dataset.t)},hist,theme,login,look(){look(b.dataset.t)},lkx(){$("#lk").hidden=true},lkgo(){lkGo()},sayw(){const o=S.voice;S.voice=b.dataset.v;speak(b.dataset.t,b);S.voice=o},pv(){try{localStorage.setItem("eng_prov",b.dataset.v)}catch(x){}kbUI()},goog(){authGo("goog")},signin(){authGo("in")},signup(){authGo("signup")},forgot(){authGo("forgot")},out(){FA.Au.signOut(FA.auth).then(()=>toast("Đã đăng xuất"))},hint(){const h=$("#hint");h.innerHTML=h.innerHTML?"":`<div class="hint">💡 ${esc(S.items[S.i].h||"Chưa có gợi ý cho từ này.")}</div>`},redo(){const s=HL.find(x=>x.id==b.dataset.id);if(s){S.words=[...s.words];S.level=s.level;setup()}},del(){delS(b.dataset.id).then(hist)}})[b.dataset.a]?.()});
/* ---------- Tài khoản, lịch sử, giao diện ---------- */
let DB,ME,HL=[];const LS="eng_hist";
const lsGet=()=>{try{return JSON.parse(localStorage.getItem(LS)||"[]")}catch(e){return[]}},lsSet=l=>{try{localStorage.setItem(LS,JSON.stringify(l.slice(0,30)))}catch(e){}};
async function save(s){try{const c=fsCol();if(c){await FA.F.setDoc(FA.F.doc(c,s.id),s);return}if(DB){await DB.doc(s.id).set(s);return}}catch(e){}lsSet([s,...lsGet().filter(x=>x.id!=s.id)])}
async function delS(id){try{const c=fsCol();if(c)await FA.F.deleteDoc(FA.F.doc(c,id));else if(DB)await DB.doc(id).delete()}catch(e){}lsSet(lsGet().filter(x=>x.id!=id))}
async function acct(){try{const u=await window.claude?.use("user"),d=await window.claude?.use("db");if(u){ME=await u.me();if(d&&ME.id)DB=d.collection("data/users/"+ME.id)}}catch(e){}bar()}
function bar(){if(FA){barFB();return}$("#who").innerHTML=ME&&ME.id?`<img src="${esc(ME.avatarUrl)}" alt="">${esc(ME.name||"Bạn")} · ${DB?"lịch sử lưu theo tài khoản":"lịch sử lưu trên thiết bị này"}`:"Chưa đăng nhập · lịch sử lưu trên thiết bị này"}
async function hist(){TTS&&speechSynthesis.cancel();$("#app").innerHTML='<section class="card sk"><i></i><i></i><i></i></section>';let l=[];try{const c=fsCol();if(c)l=(await FA.F.getDocs(FA.F.query(c,FA.F.orderBy("t","desc"),FA.F.limit(30)))).docs.map(d=>d.data());else if(DB)l=(await DB.orderBy("t","desc").limit(30).get()).docs.map(d=>d.data())}catch(e){}
const m=new Map();[...l,...lsGet()].forEach(s=>m.set(s.id,s));HL=[...m.values()].sort((a,b)=>b.t-a.t);
$("#app").innerHTML=`<div class="top"><h2>📚 Lịch sử luyện tập</h2><button class="btn ghost" data-a="reset">← Quay lại</button></div>`+(HL.length?HL.map(s=>{const av=s.items.length?Math.round(s.items.reduce((t,x)=>t+x.s,0)/s.items.length):0;return `<details class="hs"><summary>${new Date(s.t).toLocaleString("vi-VN")} · Cấp ${s.level} · ${s.items.length}/${s.words.length} câu · ${av}/100${s.src=="demo"?" · Demo":""}</summary><p class="mu">${s.words.map(esc).join(", ")}</p>${s.items.map(x=>`<div class="rs"><b>${x.s}</b><div><p class="mu">${esc(x.vi)}</p><p>Bạn: ${esc(x.a)}</p><p class="fix">Đã sửa: ${esc(x.c)}</p></div></div>`).join("")}<div class="row"><button class="btn ghost" data-a="redo" data-id="${esc(s.id)}">↻ Luyện lại các từ này</button><button class="ic" data-a="del" data-id="${esc(s.id)}">Xóa</button></div></details>`}).join(""):'<p class="mu">Chưa có phiên nào. Hoàn thành một câu để bắt đầu lưu lịch sử.</p>')}
/* ---------- API Key (khi host ngoài claude.ai) ---------- */
const PV=()=>{try{return localStorage.getItem("eng_prov")||"g"}catch(e){return"g"}};
const KEY=()=>{try{return localStorage.getItem(PV()=="g"?"eng_gkey":"eng_key")||""}catch(e){return""}};
function kbUI(){const g=PV()=="g";$("#kb").innerHTML=`<h2>Khóa API (API Key)</h2><div class="seg"><button class="${g?"on":""}" data-a="pv" data-v="g">Gemini · có gói miễn phí</button><button class="${g?"":"on"}" data-a="pv" data-v="c">Claude · trả phí</button></div><input id="ak" type="password" placeholder="${g?"AIza…":"sk-ant-…"}" autocomplete="off" style="margin-top:10px"><p class="mu">${g?"Tạo key miễn phí trong Google AI Studio (aistudio.google.com), mục Get API key. Gói miễn phí giới hạn số lượt mỗi ngày, và nội dung bạn gửi có thể được Google dùng để cải thiện sản phẩm.":"Lấy key tại platform.claude.com (Settings → API keys). Cần nạp tiền trước; mỗi lượt tạo/chấm bài tính phí vào tài khoản API của bạn."} Key chỉ lưu trong trình duyệt này và gửi thẳng tới nhà cung cấp.</p>`;const k=$("#ak");k.value=KEY();k.oninput=e=>{try{localStorage.setItem(PV()=="g"?"eng_gkey":"eng_key",e.target.value.trim())}catch(x){}}}
async function api(p){return PV()=="g"?gem(p):apiC(p)}
const GM=["gemini-3.5-flash","gemini-3.5-flash-lite"];
async function gem(p){let er;for(const m of GM){const r=await fetch("https://generativelanguage.googleapis.com/v1beta/models/"+m+":generateContent",{method:"POST",headers:{"content-type":"application/json","x-goog-api-key":KEY()},body:JSON.stringify({contents:[{parts:[{text:p}]}],generationConfig:{responseMimeType:"application/json"}})}),d=await r.json().catch(()=>({}));if(r.ok){const x=(((d.candidates||[])[0]||{}).content||{}).parts,t=x?x.map(q=>q.text||"").join(""):"";if(t)return{text:t};er={code:"api",message:"Gemini không trả về nội dung, hãy thử lại."};continue}er={code:"api",message:r.status==429?"Đã hết lượt dùng miễn phí hiện tại. Hãy thử lại sau ít phút hoặc sang ngày mới.":d.error&&d.error.message};if(![404,429,503].includes(r.status))throw er}throw er}
async function apiC(p){const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":KEY(),"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:"claude-sonnet-5-5",max_tokens:3000,messages:[{role:"user",content:p}]})});const d=await r.json();if(!r.ok)throw{code:"api",message:d.error&&d.error.message};return{text:d.content.map(c=>c.text||"").join("")}}
/* ---------- Đăng nhập Google / email (Firebase Auth + Firestore) ---------- */
const fsCol=()=>FA&&FA.user?FA.F.collection(FA.db,"users",FA.user.uid,"sessions"):null;
async function fbInit(){if(!FB.apiKey)return;try{const b="https://www.gstatic.com/firebasejs/10.14.1/",[A,Au,F]=await Promise.all([import(b+"firebase-app.js"),import(b+"firebase-auth.js"),import(b+"firebase-firestore.js")]),app=A.initializeApp(FB);FA={Au,F,auth:Au.getAuth(app),db:F.getFirestore(app)};Au.onAuthStateChanged(FA.auth,u=>{FA.user=u;bar()});bar()}catch(e){FA=null}}
function barFB(){const u=FA.user;$("#who").innerHTML=u?`${u.photoURL?`<img src="${esc(u.photoURL)}" alt="" referrerpolicy="no-referrer">`:""}${esc(u.displayName||u.email||"Bạn")} · <button class="ic" data-a="out">Đăng xuất</button>`:`<button class="btn" data-a="login" style="padding:4px 14px">Đăng nhập</button> <span class="mu">để lưu lịch sử theo tài khoản</span>`}
function login(){$("#app").innerHTML=`<section class="card"><h2>Đăng nhập</h2><button class="btn" data-a="goog" style="width:100%">Tiếp tục với Google</button><p class="mu c">hoặc dùng email</p><input id="em" type="email" placeholder="Email" autocomplete="email"><input id="pw" type="password" placeholder="Mật khẩu (từ 6 ký tự)" autocomplete="current-password" style="margin-top:8px"><div class="row"><button class="btn" data-a="signin">Đăng nhập</button><button class="btn ghost" data-a="signup">Tạo tài khoản</button><button class="ic" data-a="forgot">Quên mật khẩu?</button></div><p class="err" id="er"></p><button class="ic" data-a="reset">← Quay lại</button></section>`}
const FE={"auth/invalid-credential":"Email hoặc mật khẩu chưa đúng.","auth/invalid-email":"Email không hợp lệ.","auth/email-already-in-use":"Email này đã có tài khoản, hãy đăng nhập.","auth/weak-password":"Mật khẩu cần ít nhất 6 ký tự.","auth/popup-closed-by-user":"Bạn đã đóng cửa sổ đăng nhập.","auth/unauthorized-domain":"Tên miền này chưa được thêm vào Authorized domains của Firebase."};
async function authGo(k){const er=$("#er"),A=FA.Au,a=FA.auth;er.textContent="";try{if(k=="goog")await A.signInWithPopup(a,new A.GoogleAuthProvider());else{const e=$("#em").value.trim(),p=$("#pw").value;if(k=="forgot"){if(!e){er.textContent="Nhập email trước.";return}await A.sendPasswordResetEmail(a,e);er.textContent="Đã gửi email đặt lại mật khẩu (kiểm tra cả mục Spam).";return}await(k=="signup"?A.createUserWithEmailAndPassword:A.signInWithEmailAndPassword)(a,e,p)}toast("Đã đăng nhập");reset()}catch(x){er.textContent=FE[x.code]||"Không đăng nhập được. Vui lòng thử lại."}}
/* ---------- Tra từ vựng ---------- */
const LC={};
const wf=t=>String(t||"").split(/(\s+)/).map(w=>{const c=w.replace(/^[^A-Za-z]+|[^A-Za-z]+$/g,"");return c?`<span class="w" data-a="look" data-t="${esc(c)}">${esc(w)}</span>`:esc(w)}).join("");
const lookPrompt=(w,l)=>`Bạn là từ điển Anh-Việt thân thiện cho người học tiếng Anh. ${RULE}
Từ/cụm từ cần tra: ${JSON.stringify(w)} (có thể là tiếng Anh hoặc tiếng Việt). Trình độ người học: ${LV[l-1][0]}.
Nếu là tiếng Việt, chọn từ/cụm tiếng Anh tự nhiên nhất tương ứng rồi tra từ đó; nếu là dạng biến đổi (ví dụ went, running), tra dạng gốc và nói rõ ở "usage".
Định dạng: {"word":"từ tiếng Anh","pos":"loại từ bằng tiếng Việt, ví dụ: động từ, danh từ, tính từ","ipa_us":"/phiên âm Mỹ/","ipa_uk":"/phiên âm Anh/","meaning":"nghĩa tiếng Việt ngắn gọn, các nghĩa cách nhau dấu chấm phẩy","usage":"giải thích tiếng Việt 3-5 câu: cách dùng, sắc thái (trang trọng/thân mật), giới từ đi kèm, lỗi người Việt hay mắc","examples":[{"en":"câu ví dụ","vi":"dịch tiếng Việt"}],"collocations":[{"p":"cụm từ đi kèm","vi":"nghĩa"}]}
Cần đúng 3 câu ví dụ (ngữ cảnh khác nhau) và 5-6 collocations phổ biến nhất.`;
function look(t){$("#lk").hidden=false;const q=$("#lq"),s=String(getSelection()||"").trim();q.value=t||(s.length<=60?s:"");if(q.value)lkGo();else{$("#lr").innerHTML='<p class="mu">Gõ từ rồi bấm Tra. Trong bài, bạn cũng có thể bấm vào từ trong câu gợi ý để tra nhanh.</p>';q.focus()}}
async function lkGo(){const q=$("#lq").value.trim(),r=$("#lr");if(!q)return;const k=q.toLowerCase();
if(!await smp()&&!KEY()){r.innerHTML='<p class="err">Hãy nhập API Key ở màn hình thiết lập để dùng tra từ.</p>';return}
if(LC[k]){r.innerHTML=lkHTML(LC[k]);return}
r.innerHTML='<div class="sk"><i></i><i></i><i></i></div>';
try{const d=await ask(lookPrompt(q,S.level));if(!d.word||!d.meaning)throw 0;LC[k]=d;r.innerHTML=lkHTML(d)}catch(e){r.innerHTML=`<p class="err">${esc(e&&e.code=="api"?(e.message||"Lỗi API"):"Không tra được từ này. Vui lòng thử lại.")}</p>`}}
const lkHTML=d=>{const w=esc(d.word||""),ex=(d.examples||[]).slice(0,3),co=(d.collocations||[]).slice(0,6);
return `<div style="margin-top:12px"><b class="lw">${w}</b> <span class="mu">${esc(d.pos||"")}</span></div><div class="lp">${["US","UK"].map(v=>`<button class="spb" data-a="sayw" data-v="${v}" data-t="${w}"><span class="ico">🔊</span><span class="bars"><i></i><i></i><i></i><i></i></span>${v} ${esc(d["ipa_"+v.toLowerCase()]||"")}</button>`).join("")}</div>
<h3>Nghĩa</h3><p>${esc(d.meaning)}</p>
<h3>Giải thích cách dùng</h3><p>${esc(d.usage||"")}</p>
<h3>Câu ví dụ <small class="mu">(bấm vào từ để tra tiếp)</small></h3>${ex.map(x=>`<div class="alt"><p class="ln">${wf(x.en)} <button class="ic" data-a="say" data-t="${esc(x.en||"")}">🔊</button></p><p class="mu">${esc(x.vi||"")}</p></div>`).join("")}
<h3>Cụm từ đi kèm</h3><div class="chips">${co.map(c=>`<span class="chip" style="padding:4px 12px"><b>${esc(c.p||"")}</b>${c.vi?` · ${esc(c.vi)}`:""}</span>`).join("")}</div><p class="mu">Phiên âm và giải thích do AI tạo, bạn nên đối chiếu thêm với từ điển khi cần.</p>`};
document.addEventListener("keydown",e=>{if(e.key=="Escape")$("#lk").hidden=true;if(e.key=="Enter"&&e.target.id=="lq")lkGo()});$("#lk").addEventListener("click",e=>{if(e.target.id=="lk")e.target.hidden=true});
